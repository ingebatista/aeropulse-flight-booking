<section class="access" aria-labelledby="access-title">
  <span class="access-mark" aria-hidden="true">▣</span>
  <p class="access-kicker">Administración</p>
  <h1 id="access-title">Acceso al control operacional</h1>
  <p class="access-description">Ingresa tu token de administración para gestionar vuelos.</p>
  @if (error()) {
    <p class="booking-alert" role="alert">{{ error() }}</p>
  }
  <form (submit)="enter($event, tokenField)" novalidate>
    <div class="booking-field">
      <label for="admin-token">Token de administración</label>
      <div class="token-control">
        <input
          #tokenField
          id="admin-token"
          [type]="tokenVisible() ? 'text' : 'password'"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
          [attr.aria-invalid]="invalid() ? 'true' : null"
          [attr.aria-describedby]="invalid() ? 'admin-token-error' : null"
          (input)="invalid.set(false)"
        />
        <button
          class="token-visibility"
          type="button"
          aria-controls="admin-token"
          (click)="tokenVisible.set(!tokenVisible())"
        >
          {{ tokenVisible() ? 'Ocultar token' : 'Mostrar token' }}
        </button>
      </div>
      @if (invalid()) {
        <small id="admin-token-error">Introduce un token sin espacios.</small>
      }
    </div>
    <div class="access-actions">
      <button type="submit" class="booking-primary">Acceder</button>
      <a routerLink="/estado-de-vuelos">Volver a estado de vuelos</a>
    </div>
  </form>
  <p class="session-note">El token se conserva en memoria durante la sesión.</p>
</section>
